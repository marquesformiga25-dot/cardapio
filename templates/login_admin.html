<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Acesso da Cozinha</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo.css') }}">
</head>

<body>

    <header>
        <div>
            <h1>Cardápio na Palma da Mão!</h1>
            <p>Campus Sousa | Sistema de Pré-seleção de Refeições</p>
        </div>
    </header>

    <div class="login-cozinha">

        <h2>Área dos responsáveis</h2>

        <p>Informe seu usuário e senha para acessar os resultados.</p>

        <form action="{{ url_for('admin') }}" method="POST">

            <label for="usuario">Usuário</label>
            <input type="text" id="usuario" name="usuario" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" required>

            <button type="submit">ENTRAR</button>

        </form>

        <a href="/">Voltar para a página inicial</a>

    </div>

</body>
</html>
